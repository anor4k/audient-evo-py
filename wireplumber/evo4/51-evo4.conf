## Audient EVO4 — WirePlumber device rules
##
## - Disables ALSA UCM so the card falls back to ACP. UCM gets auto-selected
##   once evo_raw renames the volume control to "Master Playback Volume"
##   (which makes the EVO4 match a stock UCM profile), but UCM exposes
##   HiFi__* sinks that don't drive the Master mixer and displaces the
##   4-channel surround40 device the loopback modules need.
## - Disables idle suspension to prevent clicks/pops on resume
## - Disables upmix so stereo apps only send to CH1/CH2 (FL/FR),
##   keeping CH3/CH4 (RL/RR) clean for the loopback bus
## - Renames the ALSA nodes for clarity
##
## Install: ~/.config/wireplumber/wireplumber.conf.d/51-evo4.conf

monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.usb-Audient_EVO4-00" }
    ]
    actions = {
      update-props = {
        api.alsa.use-ucm = false
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.usb-Audient_EVO4-00.*" }
    ]
    actions = {
      update-props = {
        node.pause-on-idle = false
        node.description = "EVO4 Hardware (4ch)"
        channelmix.upmix = false
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_input.usb-Audient_EVO4-00.*" }
    ]
    actions = {
      update-props = {
        node.pause-on-idle = false
        node.description = "EVO4 Capture"
      }
    }
  }
]
