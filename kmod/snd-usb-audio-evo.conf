# Audient EVO quirk flags for snd-usb-audio.
#
# The EVO firmware rejects some USB SET_CUR requests on its output Feature
# Unit (FU10) - notably the -127 dB minimum that PipeWire writes to the
# loopback channels (3/4) of the 4-channel "Master Playback Volume".
# Kernels < 7.2 silently ignored the failure; since 7.2 mixer_ctl_feature_put()
# aborts and returns the error to userspace, which makes PipeWire/ACP believe
# the hardware write failed entirely and apply the full attenuation again in
# software (output too quiet, L/R briefly mismatched, volume drifting).
#
# IGNORE_CTL_ERROR restores the pre-7.2 behaviour for EVO devices only, the
# same flag the kernel already applies to the Audient iD14.
#
# Requires the string form of quirk_flags (kernel >= 6.18). kmod/install.sh
# only installs this file when the running kernel supports it.
#
# Install: /etc/modprobe.d/snd-usb-audio-evo.conf
options snd_usb_audio quirk_flags=2708:0006:IGNORE_CTL_ERROR;2708:0007:IGNORE_CTL_ERROR
